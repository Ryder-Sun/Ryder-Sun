name: Update Profile Views Badge

on:
  schedule: # every 6h: 03:30 / 09:30 / 15:30 / 21:30 Asia/Shanghai
    - cron: "30 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-views
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update views badge
        run: node scripts/update-profile-views.mjs
        env:
          PROFILE_VIEWS_TOKEN: ${{ secrets.PROFILE_VIEWS_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add views-badge.svg scripts/profile-views-state.json README.md README.zh.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile views badge"
            git push
          fi
